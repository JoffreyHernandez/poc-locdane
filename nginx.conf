server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Assets au nom hashé (immuables) → cache navigateur long
  location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|svg|gif|ico|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA / pages prérendues : HTML jamais mis en cache (toujours les derniers chunks)
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }
}
